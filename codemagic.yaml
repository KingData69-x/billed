workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Billed App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.getbilled
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: v20
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set app version
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "app.getbilled" --platform=IOS)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-play-store:
    name: Android Play Store
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - billed_keystore
      vars:
        PACKAGE_NAME: "app.getbilled"
      node: v20
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build Android release
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
